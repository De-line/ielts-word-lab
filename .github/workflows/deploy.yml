name: Publish GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after Stage 5 approval and provenance review
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      upload_pages_artifact: ${{ inputs.publish }}
    permissions:
      contents: read

  deploy:
    if: ${{ inputs.publish == true && github.ref_name == github.event.repository.default_branch && endsWith(github.repository, '/ielts-word-lab') }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
